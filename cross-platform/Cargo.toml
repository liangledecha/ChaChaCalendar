[package]
name = "chacha-calendar-client"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
ureq = "2.12"

[build-dependencies]
slint-build = "1.15"
