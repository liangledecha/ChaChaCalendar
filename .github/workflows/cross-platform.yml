name: Cross-platform client

on:
  pull_request:
    paths:
      - "cross-platform/**"
      - ".github/workflows/cross-platform.yml"
  push:
    branches:
      - "feature/cloud-sync-clients"
    paths:
      - "cross-platform/**"
      - ".github/workflows/cross-platform.yml"

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Test core
        run: cargo test
      - name: Check client
        run: cargo check
